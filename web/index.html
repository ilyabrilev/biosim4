<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Biosim4 — Browser Viewer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="sidebar">
    <h2>biosim4</h2>

    <div class="stat">
        Generation: <span id="generation">—</span><br>
        Step: <span id="step">—</span><br>
        Alive: <span id="alive">—</span><br>
        Grid: <span id="gridSize">—</span><br>
        FPS: <span id="fps">—</span>
    </div>

    <div class="controls">
        <button id="btnPauseResume">Pause</button>
        <button id="btnRestart">Restart</button>

        <div class="speed-control">
            <label>Speed:</label>
            <input type="range" id="speedSlider" min="0" max="5" value="0" step="1">
            <span id="speedVal">0</span>
        </div>

        <div class="setting-control">
            <label>Challenge:</label>
            <div class="setting-input">
                <select id="challengeSelect"></select>
            </div>
        </div>

        <div class="setting-control">
            <label>Barrier:</label>
            <div class="setting-input">
                <select id="barrierSelect"></select>
            </div>
        </div>

        <div class="setting-control">
            <label>Mutation Rate:</label>
            <div class="setting-input">
                <input type="text" id="mutationRate" value="0.001" size="8">
                <button id="btnMutationOk">Ok</button>
            </div>
        </div>

        <div class="setting-control">
            <label>Steps/Generation:</label>
            <div class="setting-input">
                <input type="text" id="stepsPerGen" value="300" size="8">
                <button id="btnStepsOk">Ok</button>
            </div>
        </div>

        <div class="setting-control">
            <label>Population:</label>
            <div class="setting-input">
                <input type="text" id="population" value="3000" size="8">
                <button id="btnPopulationOk">Ok</button>
            </div>
        </div>

        <div class="setting-control checkbox-control">
            <label>
                <input type="checkbox" id="killEnable">
                Kill enabled
            </label>
        </div>
    </div>

    <div id="status" class="disconnected">Disconnected</div>
</div>

<div id="canvas-container">
    <canvas id="canvas"></canvas>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
